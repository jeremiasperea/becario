[project]
name = "becario"
version = "1.0.0"
description = "B.E.C.A.R.I.O. - Asistente Telegram para clusters HPC con Slurm"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0",
    "paramiko>=3.4",
    "pydantic>=2.6",
    "httpx>=0.27",
    "ase>=3.23",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["becario*"]
