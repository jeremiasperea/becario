[project]
name = "becario"
version = "1.0.0"
description = "B.E.C.A.R.I.O. - Asistente Telegram para clusters HPC con Slurm"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0",
    "paramiko>=3.4",
    "pydantic>=2.6",
    "httpx>=0.27",
    "ase>=3.23",
    "faster-whisper>=1.0",
    # Fuente de estructuras cristalinas para compuestos que ASE no arma
    # (corundum, spinel, perovskitas). emmet-core se fija <0.86 porque el
    # 0.86.0rc1 hace `from typing import NotRequired` (Python 3.11+) y rompe
    # el import de MPRester en 3.10 — el 0.85.1 estable importa bien.
    "pymatgen>=2025.10.7",
    "mp-api>=0.45",
    "emmet-core<0.86",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["becario*"]

# El vocabulario de tags del INCAR es un dato, no código: sin esto viaja bien
# en una instalación editable (que es la del README) y desaparece en una
# normal, con el paquete importando y fallando recién al generar un INCAR.
[tool.setuptools.package-data]
becario = ["domain/*.json"]
